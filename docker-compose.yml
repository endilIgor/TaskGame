x-taskgame-env: &taskgame-env
  - path: .env.example
    required: true
  - path: .env
    required: false

services:
  app:
    build: .
    env_file: *taskgame-env
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

  db:
    image: mysql:8.4
    env_file: *taskgame-env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
