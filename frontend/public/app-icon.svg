<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TaskGame app icon</title>
  <desc id="desc">A fantasy productivity shield with a glowing quest star.</desc>
